# Stáhne radar → R2 (rychlé CDN) + volitelný git backup.
# Mapa = národní mozaika (ČHMÚ/DWD/SHMÚ/IMGW/MCH) + OPERA fill; tracking = OPERA.
# Viz docs/RADAR-TRIGGER.md

name: Live radar

on:
  workflow_dispatch:
  repository_dispatch:
    types: [live-radar]
  schedule:
    # GitHub cron je nespolehlivý — záloha; hlavní je Cloudflare Cron Worker (*/2)
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: live-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if R2 already fresh
        id: gate
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          MAX_AGE_MIN: "4"
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/check_r2_fresh.py

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache OPERA + CHMI + national HDF5
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            .cache/opera
            .cache/chmi
            .cache/chmi_dualpol
            .cache/national
          key: radar-h5-v3-${{ github.run_id }}
          restore-keys: |
            radar-h5-v3-
            radar-h5-v2-
            radar-h5-v1-

      - name: Install Python deps
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Fetch OPERA + national mosaics
        if: steps.gate.outputs.skip != 'true'
        run: |
          # Mapa = OPERA PNG (source of truth). Národní compositý jen pro
          # reconcile ghost pinů — nepřepisovat latest.png mozaikou
          # (vymýšlela prťavé Silná mimo realitu, např. SI/AT clutter).
          python scripts/opera_fetch_convert.py --frames 4 &
          pid_opera=$!
          python scripts/fetch_national_radar.py --sources chmi,dwd,shmu,imgw,mch &
          pid_nat=$!
          wait $pid_opera || { echo "ERROR: opera_fetch failed"; exit 1; }
          wait $pid_nat || echo "WARN: national fetch partial/failed"
          mkdir -p public/data/opera
          printf '%s\n' '{"radarSource":"opera","note":"mosaic disabled — OPERA PNG is map source of truth"}' \
            > public/data/opera/mosaic-meta.json
          # Ghost cells pryč PŘED uploadem pinů.
          python scripts/chmi_radar.py \
            || echo "WARN: chmi_radar failed"
          python scripts/reconcile_cells_national.py \
            || echo "WARN: national reconcile failed"
          python scripts/chmi_dualpol.py \
            || echo "WARN: chmi_dualpol failed"
          python scripts/write_meta.py

          # Fallback do 7 min: když OPERA composite stagnuje (zdroj nevydává),
          # mapa by „stárla", ačkoli ČHMÚ má čerstvý snímek. Pak přepni mapu
          # na národní mozaiku — frontend ukáže ČHMÚ čas místo mrtvé OPERY.
          OPERA_FALLBACK_MAX_MIN=8
          python - <<'PY'
          import datetime as dt, json, os, subprocess, sys
          from pathlib import Path
          p = Path("public/data/opera/latest-raster.json")
          max_age = float(os.environ.get("OPERA_FALLBACK_MAX_MIN", "8"))
          if not p.is_file():
              sys.exit(0)
          try:
              d = json.loads(p.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              sys.exit(0)
          raw = d.get("time") or d.get("mosaicTime")
          if not raw:
              sys.exit(0)
          digits = "".join(ch for ch in str(raw) if ch.isdigit())[:14]
          if len(digits) < 12:
              sys.exit(0)
          digits = (digits + "000000")[:14]
          try:
              shot = dt.datetime.strptime(digits, "%Y%m%d%H%M%S").replace(tzinfo=dt.timezone.utc)
          except ValueError:
              sys.exit(0)
          age = (dt.datetime.now(dt.timezone.utc) - shot).total_seconds() / 60.0
          print(f"fallback: OPERA snímek {age:.1f} min (threshold {max_age})", flush=True)
          if age < max_age:
              print("fallback: OPERA čerstvý — mozaiku necháme vypnutou", flush=True)
              sys.exit(0)
          print("fallback: OPERA stagnuje → přepínám mapu na národní mozaiku", flush=True)
          rc = subprocess.call(
              [sys.executable, "scripts/build_radar_mosaic.py",
               "--enable", "--sources", "chmi,dwd,shmu,imgw"]
          )
          if rc == 0:
              subprocess.call([sys.executable, "scripts/write_meta.py"])
          else:
              print("fallback: mosaic selhala — nechávám OPERA PNG", flush=True)
          PY

      - name: Fast-path upload (PNG + cells + meta)
        if: steps.gate.outputs.skip != 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          mkdir -p public/data/opera public/data/national
          if [ ! -f public/data/opera/mosaic-meta.json ]; then
            echo '{"radarSource":"opera"}' > public/data/opera/mosaic-meta.json
          fi
          python scripts/upload_data_r2.py \
            --files data/meta.json \
            --files data/opera/latest.png \
            --files data/opera/latest-raster.json \
            --files data/opera/mosaic-meta.json \
            --files data/opera/latest.geojson \
            --files data/opera/cells.geojson \
            --only data/opera/history/ \
            --only data/opera/archive/ \
            --only data/national/

      - name: Enrich (env + dual-pol retry) + full meta
        if: steps.gate.outputs.skip != 'true'
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          # Cells už vyčištěné výše; dual-pol znovu soft-fail pokud dřív selhal
          python scripts/chmi_dualpol.py \
            || echo "WARN: chmi_dualpol failed"

          if [ -n "${R2_PUBLIC_URL:-}" ]; then
            base="${R2_PUBLIC_URL%/}"
            mkdir -p public/data/satellite public/data/formation public/data/wind
            curl -fsS "$base/data/satellite/cooling.json" \
              -o public/data/satellite/cooling.json \
              && echo "pulled cooling.json from R2" \
              || echo "WARN: could not pull cooling from R2 — merge uses checkout"
            curl -fsS "$base/data/formation/grid.json" \
              -o public/data/formation/grid.json \
              && echo "pulled formation/grid.json from R2" \
              || echo "WARN: could not pull formation from R2"
            curl -fsS "$base/data/wind/low.json" \
              -o public/data/wind/low.json \
              && curl -fsS "$base/data/wind/upper.json" \
              -o public/data/wind/upper.json \
              && echo "pulled wind from R2" \
              || echo "WARN: could not pull wind from R2"
          fi
          # Nový bbox: formation/wind se samy přegenerují při starém pásu (domain check)
          python scripts/refresh_env_if_stale.py --skip-sat \
            || echo "WARN: env refresh failed — keep previous formation/wind"
          # Když R2 stáhlo starý bbox, vynutit formation (zapíše i wind)
          python - <<'PY'
          import json, os, subprocess, sys
          p = "public/data/formation/grid.json"
          need = True
          if os.path.isfile(p):
              try:
                  d = json.load(open(p, encoding="utf-8"))
                  need = not (
                      abs(float(d.get("west", 0)) - 5.8) < 0.05
                      and abs(float(d.get("east", 0)) - 24.2) < 0.05
                      and abs(float(d.get("south", 0)) - 45.7) < 0.05
                      and abs(float(d.get("north", 0)) - 55.0) < 0.05
                  )
              except Exception:
                  need = True
          if need:
              print("domain mismatch — fetch_formation --force", flush=True)
              sys.exit(subprocess.call([sys.executable, "scripts/fetch_formation.py", "--force"]))
          print("formation domain OK", flush=True)
          PY
          python scripts/merge_sat_cooling.py
          python scripts/write_meta.py

      - name: Upload full radar tree to R2
        if: steps.gate.outputs.skip != 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: python scripts/upload_data_r2.py --exclude data/satellite/

      - name: Learning emit (kalibrace — T+15/30 ověření)
        if: steps.gate.outputs.skip != 'true'
        run: python scripts/emit_learning.py
        continue-on-error: true

      - name: Git backup (meta + radar + learning)
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/meta.json public/data/opera public/data/chmi public/data/national public/data/wind public/data/formation public/data/learning
          if git diff --staged --quiet; then
            echo "No git backup changes."
          else
            git commit -m "chore: refresh radar + learning"
            git pull --rebase origin main || true
            git push origin main || echo "WARN: git backup push failed (non-fatal, R2 already updated)"
          fi

      - name: Skipped (R2 fresh)
        if: steps.gate.outputs.skip == 'true'
        run: echo "Skipped — map frame fresh (${{ steps.gate.outputs.age_min }} min)"
