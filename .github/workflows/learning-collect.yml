# Learning store — hodinová záloha + proposal (primární emit je Live radar ~5 min).
# Learning žije v R2 (gzip), ne v gitu — viz scripts/r2_learning.py. V gitu
# zůstává jen malý calibration proposal.

name: Learning collect

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: learning-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Pull learning from R2 (vše, gzip)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/r2_learning.py pull

      - name: Emit learning events
        run: python scripts/emit_learning.py

      - name: Propose calibration
        run: python scripts/propose_calibration.py

      - name: Push learning to R2 (vše, gzip)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/r2_learning.py push

      - name: Commit calibration proposal (malé, zůstává v gitu)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/calibration
          if git diff --staged --quiet; then
            echo "No calibration changes."
          else
            git commit -m "chore: calibration proposal"
            git fetch --depth=1 origin main || true
            git rebase FETCH_HEAD || { echo "WARN: shallow rebase failed — skip"; exit 0; }
            git push origin HEAD:main || echo "WARN: calibration push failed"
          fi
